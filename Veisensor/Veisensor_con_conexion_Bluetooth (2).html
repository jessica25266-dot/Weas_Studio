<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veisensor</title>
<style>
:root{--bg:#ede8e3;--card:#fff;--ink:#16243f;--muted:#5d6779;--navy:#25385a;--cu:#d79a68;--line:#d9d2ca;--ok:#2f8f5b;--warn:#c98a12;--bad:#c23b30;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--card:#19243b;--ink:#eef0f4;--muted:#a7b0c2;--navy:#3c5788;--line:#2b3a58;--ok:#4cc38a;--warn:#f0b43c;--bad:#ff8a7d}}
:root[data-theme="dark"]{--bg:#0f1626;--card:#19243b;--ink:#eef0f4;--muted:#a7b0c2;--navy:#3c5788;--line:#2b3a58;--ok:#4cc38a;--warn:#f0b43c;--bad:#ff8a7d}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Poppins","Segoe UI",system-ui,sans-serif;font-size:18px;display:flex;justify-content:center}
#app{width:100%;max-width:760px;padding:16px 18px 28px}
header{display:flex;align-items:center;gap:12px;min-height:48px}
.brand{font-weight:700;color:var(--navy);letter-spacing:.04em}
.badge{margin-left:auto;font-size:14px;border:1.5px solid var(--cu);border-radius:999px;padding:4px 12px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--cu);outline-offset:2px}
.back{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;display:inline-flex;align-items:center;gap:8px}
.back .ico.xs{width:26px;height:20px}
#gear{padding:6px 10px;margin-left:auto}
header{flex-wrap:wrap;row-gap:8px}
.brandimg{height:34px;width:auto;border-radius:8px;display:block;flex-shrink:0}
p .brandimg{display:inline-block}
.chip{background:#fff;border-radius:10px;padding:3px;display:inline-flex;flex-shrink:0}
.chip .ico{width:36px;height:36px}
.btn{display:flex;align-items:center;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:16px}
h1{font-size:30px;margin:0 0 8px;line-height:1.15}h2{font-size:22px;margin:0 0 10px}
p{color:var(--muted);line-height:1.5;margin:0 0 6px}
.logo{background:#ededed;border-radius:14px;padding:14px;text-align:center}.logo img{max-width:100%;height:auto}
.btns{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:14px;padding:18px;text-align:left;font-size:19px}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--navy)}
.btn.stop{background:var(--bad);color:#fff}
.err{border-color:var(--bad);color:var(--bad);font-weight:600}
.sensors{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
.s{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.s b{display:block;font-size:34px}.s span{font-size:15px}
.bar{height:10px;background:var(--line);border-radius:6px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ok)}
.s[data-s=libre]{border-color:var(--ok)}.s[data-s=precaución]{border-color:var(--warn)}.s[data-s=peligro]{border-color:var(--bad)}
.s[data-s=precaución] i{background:var(--warn)}.s[data-s=peligro] i{background:var(--bad)}
.s[data-s=peligro] span{color:var(--bad);font-weight:700}
.cam{position:relative;height:190px;border-radius:14px;background:#222;color:#bbb;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px}
.cam.alert{outline:5px solid var(--bad)}.cam em{position:absolute;top:10px;left:10px;right:10px;background:var(--bad);color:#fff;border-radius:8px;padding:6px;font-style:normal;font-weight:700;display:none}.cam.alert em{display:block}
ul{padding-left:20px;margin:6px 0;color:var(--muted)}li{margin:4px 0}
.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:10px 0}
.tag{font-weight:700}.tag.alta{color:var(--bad)}.tag.media{color:var(--warn)}.tag.baja{color:var(--ok)}
@media(max-width:520px){.sensors{grid-template-columns:1fr}}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.switch{position:relative;display:inline-block;width:46px;height:26px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.sl{position:absolute;inset:0;background:var(--line);border-radius:26px;transition:.2s;cursor:pointer}
.sl:before{content:"";position:absolute;height:20px;width:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+.sl{background:var(--navy)}
.switch input:checked+.sl:before{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:var(--navy)}
.credit{margin-top:10px;font-weight:700;color:var(--navy);letter-spacing:.04em}
[hidden]{display:none!important}
.ico{width:36px;height:36px;object-fit:contain;vertical-align:middle;flex-shrink:0}
.ico.sm{width:28px;height:28px}.ico.xs{width:22px;height:22px}
.badge{display:flex;align-items:center;gap:6px}
.cam{overflow:hidden}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam em{z-index:1}
.rowl{display:flex;gap:12px;align-items:center;flex:1;min-width:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ico{filter:drop-shadow(0 0 1.2px #fff)}}
:root[data-theme="dark"] .ico{filter:drop-shadow(0 0 1.2px #fff)}
.thumb{width:76px;height:56px;object-fit:cover;border-radius:8px;flex-shrink:0;cursor:pointer;border:1px solid var(--line)}
</style>
</head>
<body>
<div id="app">
  <header><button class="back" id="back" hidden><img class="ico xs" id="backIco" alt="">Regresar</button><img class="brandimg" id="brandImg" alt="Veisensor"><img class="ico xs" id="dbgBadge" alt="Modo debug" title="Modo debug activo" hidden><span class="badge" id="mode" hidden></span><button class="back" id="gear" onclick="go('ajustes')" title="Ajustes"><img class="ico sm" id="gearIco" alt="Ajustes"></button></header>
  <main id="main"></main>
  <video id="camv" playsinline muted style="position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none"></video>
</div>

let debugUnlocked=false;try{debugUnlocked=localStorage.getItem("vs_debug")==="1"}catch(e){}
const DEBUG_CODE="36967";
function tryDebug(){
  const input=$("#dbgCode");
  const val=input?input.value.trim():"";
  if(val===DEBUG_CODE){
    debugUnlocked=true;
    try{localStorage.setItem("vs_debug","1")}catch(e){}
    render();
  }else{
    alert("Código incorrecto.");
  }
}
function lockDebug(){
  debugUnlocked=false;
  try{localStorage.removeItem("vs_debug")}catch(e){}
  render();
}
function testGeo(){
  if(!navigator.geolocation){alert("Geolocalización no disponible en este navegador.");return}
  navigator.geolocation.getCurrentPosition(
    p=>alert("Ubicación: "+p.coords.latitude.toFixed(4)+", "+p.coords.longitude.toFixed(4)),
    e=>alert("No se pudo obtener la ubicación: "+e.message),
    {timeout:4000}
  );
}
function debugSectionHTML(){
  if(!debugUnlocked){
    return `<p>Ingresa el código para activar el modo debug (fotos de prueba y pruebas de función).</p>
      <div class="btns"><input id="dbgCode" type="text" inputmode="numeric" placeholder="Código" style="padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px">

  }
  return `<p>Modo debug activo: prueba la cámara y las funciones sin depender del Arduino.</p>

}
/* ---------- Cámara: captura automática al registrar un bache ---------- */
let camStream=null,camFail=false;
async function startCam(){
  if(camStream)return true;
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
    camFail=false;
  }catch(e){camStream=null;camFail=true;attachCam();return false}
  const v=$("#camv");v.srcObject=camStream;
  try{await v.play()}catch(e){}
  attachCam();return true;
}
function stopCam(){
  if(camStream)camStream.getTracks().forEach(t=>t.stop());
  camStream=null;$("#camv").srcObject=null;attachCam();
}
function attachCam(){
  const v=$("#camVideo"),msg=$("#camMsg");if(!v)return;
  v.srcObject=camStream;v.hidden=!camStream;
  msg.hidden=!!camStream;
  msg.textContent=camFail?"No se pudo abrir la cámara. Permite el acceso para guardar una foto de cada bache.":"Iniciando cámara…";
}
// Toma un fotograma de la cámara en vivo y lo devuelve como imagen JPEG (vacío si no hay cámara)
function snap(){
  const v=$("#camv");
  if(!camStream||!v.videoWidth)return"";
  const w=Math.min(640,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);
  const c=document.createElement("canvas");c.width=w;c.height=h;
  c.getContext("2d").drawImage(v,0,0,w,h);
  try{return c.toDataURL("image/jpeg",.65)}catch(e){return""}
}
function flashCam(){
  const c=$("#cam");if(!c)return;
  c.classList.add("alert");
  setTimeout(()=>{const c2=$("#cam");if(c2)c2.classList.remove("alert")},1500);
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function debugSim(x){
  const own=!camStream;
  await startCam();
  if(own&&camStream)await wait(600);
  handle(x);
  if(own)setTimeout(()=>{if(!conn)stopCam()},1500);
}
async function debugSnap(){
  const own=!camStream,ok=await startCam(),box=$("#dbgPhoto");
  if(!ok){if(box)box.innerHTML=`<p class="err" style="margin-top:10px">No se pudo abrir la cámara. Revisa los permisos.</p>`;return}
  if(own)await wait(600);
  const img=snap();
  if(box)box.innerHTML=img?`<p style="margin-top:10px;font-weight:700">Captura de prueba:</p><img src="${img}" style="max-width:100%;border-radius:12px;margin-top:6px">`
    :`<p class="err" style="margin-top:10px">La cámara aún no entrega imagen. Intenta de nuevo.</p>`;
  if(own&&!conn)stopCam();
}

    <div class="card"><h2>Cámara</h2><div class="cam" id="cam"><video id="camVideo" autoplay muted playsinline hidden></video><span id="camMsg">Iniciando cámara…</span><em>📸 Captura guardada</em></div></div>
    <div class="card"><h2>Alertas y peligros</h2><ul id="log"></ul><p id="cnt"></p></div>
    <div class="btns"><button class="btn alt" onclick="go('vial')">Ver baches y topes guardados</button><button class="btn stop" onclick="stop()">Detener monitoreo</button></div>`,
  vial:`<div class="card"><h1>Sistema de información vial</h1><p>Baches y topes detectados por Veisensor.</p></div>
    <div class="card"><h2>Baches y topes (${baches.length})</h2>${baches.length?baches.slice().reverse().map((b,i)=>`<div class="row"><div class="rowl">${b.img?`<img class="thumb" src="${b.img}" onclick="zoom(${baches.length-1-i})" alt="Captura del bache">`:""}<span><b>${b.t}</b> · ${b.h}${b.pos?" · "+b.pos:""}</span></div><span class="tag ${b.g}">${b.g}</span></div>`).join(""):"<p>Aún no hay puntos guardados. Aparecerán cuando el dispositivo detecte uno.</p>"}
    ${baches.length?`<div class="btns"><button class="btn alt" onclick="baches=[];save();render()">Borrar lista</button></div>`:""}</div>
    <div class="card"><h2>Reportes de otros peligros</h2><p>Próximamente.</p></div>
    <div class="card"><h2>Rutas más seguras</h2><p>Próximamente (opcional).</p></div>`};
  $("#main").innerHTML=V[view];upd();if(view==="monitoreo")attachCam();
}
function upd(){
  if(view!=="monitoreo")return;
  let peligro=false;
  for(const k of["I","D","V"]){
    const v=d[k],s=k==="V"?stVib(v):st(v),e=$("#s"+k);if(!e)return;
    const unit=UNITS[k];
    const pct=v==null?0:k==="V"?Math.min(v,cfg.vibPeligro*1.6)/(cfg.vibPeligro*1.6)*100:(1-Math.min(v,300)/300)*100;
    e.dataset.s=s;e.querySelector("b").textContent=v==null?"--":v.toFixed(k==="V"?1:0)+" "+unit;
    e.querySelector(".t").textContent=s==="libre"?"Libre":s==="precaución"?"Precaución":s==="peligro"?"¡Peligro!":"Sin dato";
    e.querySelector("i").style.width=pct+"%";
    if(s==="peligro"){peligro=true;if(prev[k]!=="peligro")note("Peligro: sensor "+NAMES[k].toLowerCase()+" a "+v.toFixed(k==="V"?1:0)+" "+unit)}
    prev[k]=s;
  }
  if(peligro&&cfg.sonido&&Date.now()-lastBeep>700)beep();
  $("#log").innerHTML=log.slice(0,5).map(x=>`<li>${x}</li>`).join("")||"<li>Sin alertas.</li>";
  $("#cnt").textContent="Peligros viales guardados: "+baches.length;
}
function note(t){log.unshift(new Date().toLocaleTimeString()+" · "+t)}
function beep(){lastBeep=Date.now();try{ac=ac||new AudioContext();const o=ac.createOscillator();o.frequency.value=880;o.connect(ac.destination);o.start();o.stop(ac.currentTime+.15)}catch(e){}}
function save(){
  for(;;){
    try{localStorage.setItem("vs_baches",JSON.stringify(baches));return}
    catch(e){
      if(!/quota/i.test(e.name))return;                 // otro error: no tocar los datos
      const i=baches.findIndex(b=>b.img);if(i<0)return; // sin espacio: se descarta la foto más antigua
      delete baches[i].img;
    }
  }
}
function zoom(i){
  const b=baches[i];if(!b||!b.img)return;
  const o=document.createElement("div");
  o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:9;padding:16px;color:#fff;text-align:center";
  o.innerHTML=`<img src="${b.img}" style="max-width:100%;max-height:80%;border-radius:12px"><div>${b.t} · ${b.g} · ${b.h}</div>`;
  o.onclick=()=>o.remove();document.body.appendChild(o);
}
function addBache(t,g){
  const img=snap();   // captura de la cámara justo en el instante de la detección
  if(img)flashCam();
  const b={t:t[0]+t.slice(1).toLowerCase(),g,h:new Date().toLocaleString(),pos:"",img};
  const fin=()=>{baches.push(b);save();note(b.t+" "+g+" guardado"+(img?" con foto":""));if(view==="monitoreo")upd()};
  if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{b.pos=p.coords.latitude.toFixed(4)+", "+p.coords.longitude.toFixed(4);fin()},fin,{timeout:2000});else fin();
}
// Formato del Arduino: "I:120,D:85,V:0.5"  y  "BACHE:media" o "TOPE:alta"
function handle(l){
  let m=l.match(/^(BACHE|TOPE):(baja|media|alta)/i);
  if(m)return addBache(m[1].toUpperCase(),m[2].toLowerCase());
  l.split(",").forEach(p=>{const q=p.split(":");if("IDV".includes(q[0])&&q[0].length===1&&!isNaN(q[1]))d[q[0]]=+q[1]});
  upd();
}
function sim(){
  conn="sim";d={I:180,D:150,V:0.3};
  timer=setInterval(()=>{
    for(const k of["I","D"])d[k]=Math.max(15,Math.min(300,d[k]+(Math.random()-.5)*60));
    d.V=Math.max(0,Math.min(6,d.V+(Math.random()-.5)*1.2));
    if(Math.random()<.03)handle((Math.random()<.5?"BACHE":"TOPE")+":"+["baja","media","alta"][Math.random()*3|0]);upd()},500);
  err="";hist=["inicio"];view="monitoreo";render();startCam();
}
// Conexión Bluetooth (Web Bluetooth API). UUIDs típicas de módulos BLE baratos (HM-10/HC-08).
// Si tu módulo usa otro UUID de servicio, cámbialo aquí.
const BT_SERVICE=0xFFE0, BT_CHAR=0xFFE1;
let btDevice=null, btChar=null, btBuf="";
async function bluetooth(){
  if(!("bluetooth" in navigator)){err="Este navegador no soporta Bluetooth. Usa Chrome o Edge en Android/computadora (no funciona en iPhone/Safari).";return render()}
  try{
    btDevice=await navigator.bluetooth.requestDevice({filters:[{services:[BT_SERVICE]}],optionalServices:[BT_SERVICE]});
    const server=await btDevice.gatt.connect();
    const service=await server.getPrimaryService(BT_SERVICE);
    btChar=await service.getCharacteristic(BT_CHAR);
    await btChar.startNotifications();
  }catch(e){err="No se pudo conectar por Bluetooth. Revisa que el módulo esté encendido y cerca. ("+e.message+")";return render()}
  conn="bt";err="";hist=["inicio"];view="monitoreo";render();startCam();
  btBuf="";
  btChar.addEventListener("characteristicvaluechanged",e=>{
    btBuf+=new TextDecoder().decode(e.target.value);
    let i;while((i=btBuf.indexOf("\n"))>=0){handle(btBuf.slice(0,i).trim());btBuf=btBuf.slice(i+1)}
  });
  btDevice.addEventListener("gattserverdisconnected",()=>{
    if(conn==="bt"){conn=null;err="Se perdió la conexión Bluetooth. Acércate al dispositivo e intenta de nuevo.";hist=["inicio"];view="conectar";render()}
  });
}
async function usb(){
  if(!("serial" in navigator)){err="Este navegador no permite conectar por USB. Abre la app en Chrome o Edge desde una computadora.";return render()}
  try{port=await navigator.serial.requestPort();await port.open({baudRate:9600})}
  catch(e){err="Dispositivo no conectado. Revisa el cable y vuelve a intentar.";return render()}
  conn="usb";err="";hist=["inicio"];view="monitoreo";render();startCam();
  const dec=new TextDecoderStream();port.readable.pipeTo(dec.writable).catch(()=>{});
  reader=dec.readable.getReader();let buf="";
  try{for(;;){const r=await reader.read();if(r.done)break;buf+=r.value;let i;while((i=buf.indexOf("\n"))>=0){handle(buf.slice(0,i).trim());buf=buf.slice(i+1)}}}catch(e){}
  if(conn==="usb"){conn=null;err="Se perdió la conexión con el dispositivo. Revisa el cable e intenta de nuevo.";hist=["inicio"];view="conectar";render()}
}
async function stop(){
  const c=conn;conn=null;clearInterval(timer);d={I:null,D:null,V:null};prev={};stopCam();
  if(c==="usb"){try{await reader.cancel()}catch(e){}try{await port.close()}catch(e){}}
  if(c==="bt"){try{if(btDevice&&btDevice.gatt.connected)btDevice.gatt.disconnect()}catch(e){}}
  hist=[];view="inicio";render();
}
render();
</script>
</body>
</html>
